name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, types, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # --affected compares against main, so it needs the git history.
          # A shallow clone would make every package look changed.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version comes from "packageManager"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only packages changed by this PR (and the packages that depend on
      # them) run. Editing packages/tokens re-checks admin, landing, kalee
      # and keloo; editing only apps/admin checks just admin.
      - name: Lint, type-check, test and build affected packages
        run: pnpm turbo run lint check-types test build --affected
        env:
          # actions/checkout only creates remote branches (origin/main), not a
          # local "main". Without this, Turbo can't find the base and silently
          # runs every package. On a push to main, compare with the previous
          # tip of main.
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
